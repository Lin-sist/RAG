<text x="1016" y="425" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0D0D0D">默认收起</text>
<polyline points="1143,418 1148,423 1153,418" fill="none" stroke="#5D5D5D" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="472" y="475" width="696" height="1" rx="0" fill="#E5E5E5"/>
<rect x="472" y="505" width="696" height="114" rx="10" fill="#F9F9F9" stroke="#E5E5E5"/>
<text x="490" y="537" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#0D0D0D">回答方式</text>
<text x="490" y="566" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#5D5D5D">同步／流式可在输入框高级选项中选择。</text>
<text x="490" y="595" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5D5D5D">来源是否可见，仍取决于本次回答的完整终态。</text>
<text x="472" y="670" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5D5D5D">输入法正在选词时，Enter 用于确认文字。</text>
<text x="240" y="837" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#5D5D5D">设计草案 · 五类导航 / 单层浮层 / 当前浏览器保存 · 非功能界面</text>
</svg>
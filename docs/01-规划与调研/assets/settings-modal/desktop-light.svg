<text x="472" y="319" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" font-weight="400" fill="#0D0D0D">发送快捷键</text>
<text x="472" y="347" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5D5D5D">Shift + Enter 换行，发送按钮始终可用。</text>

groups:
  - name: rag-local-reference
    rules:
      - alert: RagAskErrorRatioHigh
        expr: |
          (
            sum(rate(rag_operation_count{rag_operation="ask",rag_outcome=~"error|timeout|cancelled"}[10m]))
            /
            clamp_min(sum(rate(rag_operation_count{rag_operation="ask"}[10m])), 1)
          ) > 0.05
          and
          sum(increase(rag_operation_count{rag_operation="ask"}[10m])) >= 20
        for: 2m
        labels:
          severity: warning
          policy: non_sla_reference
        annotations:
          summary: Local reference ask error ratio is above 5 percent
          description: non_sla_reference; at least 20 ask operations in 10 minutes are required.

      - alert: RagProviderFallbackRatioHigh
        expr: |
          (
            sum(rate(rag_fallback_count[15m]))
            /
            clamp_min(sum(rate(rag_provider_call_count[15m])), 1)
          ) > 0.10
          and
          sum(increase(rag_provider_call_count[15m])) >= 20
        for: 2m
        labels:
          severity: warning
          policy: non_sla_reference
        annotations:
          summary: Local reference provider fallback ratio is above 10 percent
          description: non_sla_reference; at least 20 actual provider calls in 15 minutes are required.

      - alert: OtelCollectorTelemetryFailure
        expr: |
          sum(increase(otelcol_receiver_refused_spans[5m])) > 0
          or sum(increase(otelcol_receiver_refused_metric_points[5m])) > 0
          or sum(increase(otelcol_exporter_send_failed_spans[5m])) > 0
          or sum(increase(otelcol_exporter_send_failed_metric_points[5m])) > 0
          or sum(increase(otelcol_processor_refused_spans[5m])) > 0
          or sum(increase(otelcol_processor_refused_metric_points[5m])) > 0
        for: 1m
        labels:
          severity: warning
          policy: non_sla_reference
        annotations:
          summary: Collector reports refused or failed telemetry
          description: non_sla_reference; inspect the local Collector before relying on recent telemetry.
